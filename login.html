<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Connexion - Système Hospitalier</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        .btn-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 25px;
        }
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
    </style>
    </head>
    <body>
        <div class="login-container">
            <h2 class="text-center mb-4">Système Hospitalier</h2>

            <!-- Formulaire de connexion -->
            <div id="loginForm">
                <h4 class="text-center mb-3">Connexion</h4>
                <form id="loginFormData">
                    <div class="mb-3">
                        <label for="username" class="form-label">Nom
                            d'utilisateur</label>
                        <input type="text" class="form-control" id="username"
                            required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Mot de
                            passe</label>
                        <input type="password" class="form-control"
                            id="password" required>
                    </div>
                    <button type="submit" class="btn btn-custom w-100 mb-3">Se
                        connecter</button>
                </form>
                <div class="text-center">
                    <button type="button" class="btn btn-link"
                        onclick="showRegisterForm()">Créer un compte</button>
                </div>
            </div>

            <!-- Formulaire d'inscription -->
            <div id="registerForm" style="display: none;">
                <h4 class="text-center mb-3">Inscription</h4>
                <form id="registerFormData">
                    <div class="mb-3">
                        <label for="regUsername" class="form-label">Nom
                            d'utilisateur</label>
                        <input type="text" class="form-control" id="regUsername"
                            required>
                    </div>
                    <div class="mb-3">
                        <label for="regName" class="form-label">Nom
                            complet</label>
                        <input type="text" class="form-control" id="regName"
                            required>
                    </div>
                    <div class="mb-3">
                        <label for="regPassword" class="form-label">Mot de
                            passe</label>
                        <input type="password" class="form-control"
                            id="regPassword" required>
                    </div>
                    <div class="mb-3">
                        <label for="regRole" class="form-label">Rôle</label>
                        <select class="form-control" id="regRole" required>
                            <option value="patient">Patient</option>
                            <option value="medecin">Médecin</option>
                            <option value="infirmier">Infirmier</option>
                            <option value="admin">Administrateur</option>
                        </select>
                    </div>
                    <button type="submit"
                        class="btn btn-custom w-100 mb-3">S'inscrire</button>
                </form>
                <div class="text-center">
                    <button type="button" class="btn btn-link"
                        onclick="showLoginForm()">Retour à la connexion</button>
                </div>
            </div>

            <div id="message" class="mt-3"></div>
        </div>

        <script>
        // Charger les utilisateurs depuis localStorage
        function loadUsers() {
            const users = localStorage.getItem('hospital_users');
            return users ? JSON.parse(users) : {};
        }

        // Sauvegarder les utilisateurs dans localStorage
        function saveUsers(users) {
            localStorage.setItem('hospital_users', JSON.stringify(users));
        }

        // Afficher le formulaire d'inscription
        function showRegisterForm() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
        }

        // Afficher le formulaire de connexion
        function showLoginForm() {
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
        }

        // Gestionnaire de connexion
        document.getElementById('loginFormData').addEventListener('submit', function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const users = loadUsers();
            const user = users[username];

            if (user && user.password === password) {
                // Stocker l'utilisateur connecté
                sessionStorage.setItem('current_user', JSON.stringify(user));
                showMessage('Connexion réussie ! Redirection...', 'success');
                setTimeout(() => {
                    // Rediriger selon le rôle
                    const rolePages = {
                        'admin': 'admin.html',
                        'medecin': 'medecin.html',
                        'infirmier': 'infirmier.html',
                        'patient': 'patient.html'
                    };
                    window.location.href = rolePages[user.role] || 'dashboard.html';
                }, 1000);
            } else {
                showMessage('Identifiants incorrects', 'danger');
            }
        });

        // Gestionnaire d'inscription
        document.getElementById('registerFormData').addEventListener('submit', function(e) {
            e.preventDefault();

            const username = document.getElementById('regUsername').value;
            const name = document.getElementById('regName').value;
            const password = document.getElementById('regPassword').value;
            const role = document.getElementById('regRole').value;

            const users = loadUsers();

            if (users[username]) {
                showMessage('Cet utilisateur existe déjà', 'danger');
                return;
            }

            users[username] = {
                username: username,
                name: name,
                password: password,
                role: role
            };

            saveUsers(users);
            showMessage('Inscription réussie ! Vous pouvez maintenant vous connecter.', 'success');
            setTimeout(() => {
                showLoginForm();
            }, 2000);
        });

        // Afficher un message
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `<div class="alert alert-${type}" role="alert">${text}</div>`;
        }
    </script>
    </body>
</html>
