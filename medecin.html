<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Médecin - Système Hospitalier</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <style>
            body { background-color: #f8f9fa; }
            .navbar-custom { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
            .card-custom { border: none; border-radius: 10px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        </style>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
            <div class="container">
                <a class="navbar-brand" href="#">👨‍⚕️ Espace Médecin</a>
                <div class="navbar-nav ms-auto">
                    <span class="navbar-text me-3" id="userInfo"></span>
                    <button class="btn btn-outline-light btn-sm"
                        onclick="logout()">Déconnexion</button>
                </div>
            </div>
        </nav>

        <div class="container mt-5">
            <div class="row">
                <div class="col-md-6 mb-4">
                    <div class="card card-custom">
                        <div class="card-header bg-info text-white">
                            <h5>Mes Patients</h5>
                        </div>
                        <div class="card-body">
                            <button class="btn btn-primary btn-sm mb-3"
                                onclick="loadMyPatients()">Voir mes
                                patients</button>
                            <div id="patients" class="mt-3"></div>
                        </div>
                    </div>
                </div>

                <div class="col-md-6 mb-4">
                    <div class="card card-custom">
                        <div class="card-header bg-success text-white">
                            <h5>Mon Agenda</h5>
                        </div>
                        <div class="card-body">
                            <button class="btn btn-primary btn-sm mb-3"
                                onclick="loadSchedule()">Voir mon
                                agenda</button>
                            <button class="btn btn-success btn-sm"
                                onclick="addAvailability()">Ajouter une
                                disponibilité</button>
                            <div id="schedule" class="mt-3"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-12 mb-4">
                    <div class="card card-custom">
                        <div class="card-header bg-info text-white">
                            <h5>Assignation des Patients aux Infirmiers</h5>
                        </div>
                        <div class="card-body">
                            <p>Distribuer les patients aux infirmiers pour le
                                suivi</p>
                            <button class="btn btn-primary btn-sm mb-3"
                                onclick="loadPatientAssignments()">Voir les
                                patients</button>
                            <div id="patient-assignments" class="mt-3"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-12 mb-4">
                    <div class="card card-custom">
                        <div class="card-header bg-warning text-dark">
                            <h5>Rendez-vous d'aujourd'hui</h5>
                        </div>
                        <div class="card-body">
                            <div id="todayAppointments"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-12 mb-4">
                    <div class="card card-custom">
                        <div class="card-header bg-danger text-white">
                            <h5>Prescriptions</h5>
                        </div>
                        <div class="card-body">
                            <button class="btn btn-primary btn-sm"
                                onclick="createPrescription()">Créer une
                                ordonnance</button>
                            <div id="prescriptions" class="mt-3"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
        window.onload = function() {
            const currentUser = sessionStorage.getItem('current_user');
            if (!currentUser) {
                window.location.href = 'login.html';
                return;
            }

            const user = JSON.parse(currentUser);
            if (user.role !== 'medecin') {
                window.location.href = 'dashboard.html';
                return;
            }

            document.getElementById('userInfo').textContent = `Dr. ${user.name} (Médecin)`;
            loadSchedule();
            loadMyAppointments();
        };

        function logout() {
            sessionStorage.removeItem('current_user');
            window.location.href = 'login.html';
        }

        function loadMyPatients() {
            document.getElementById('patients').innerHTML = '<p class="text-muted">Aucun patient assigné</p>';
        }

        function loadSchedule() {
            const currentUser = JSON.parse(sessionStorage.getItem('current_user'));
            const appointments = JSON.parse(localStorage.getItem('hospital_appointments') || '[]');
            const container = document.getElementById('schedule');

            const myAppointments = appointments.filter(apt => apt.doctorName === currentUser.name);

            let html = '<button class="btn btn-sm btn-primary mb-3" onclick="addAvailability()">+ Ajouter disponibilité</button>';
            
            if (myAppointments.length === 0) {
                html += '<p class="text-muted">Aucun rendez-vous programmé</p>';
                container.innerHTML = html;
                return;
            }

            html += '<div class="table-responsive"><table class="table table-striped table-sm">';
            html += '<thead><tr><th>Patient</th><th>Date/Heure</th><th>Motif</th><th>Statut</th><th>Actions</th></tr></thead>';
            html += '<tbody>';

            myAppointments.forEach(apt => {
                const date = new Date(apt.date).toLocaleDateString('fr-FR');
                const time = new Date(apt.date).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                html += `<tr>
                    <td>${apt.patientName}</td>
                    <td>${date} ${time}</td>
                    <td>${apt.reason}</td>
                    <td><span class="badge ${apt.confirmed ? 'bg-success' : 'bg-warning'}">${apt.confirmed ? 'Confirmé' : 'En attente'}</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-success" onclick="confirmAppointment(${apt.id})">Confirmer</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="cancelAppointment(${apt.id})">Annuler</button>
                    </td>
                </tr>`;
            });

            html += '</tbody></table></div>';
            container.innerHTML = html;
        }

        function addAvailability() {
            const dateStr = prompt('Date de disponibilité (format: JJ/MM/YYYY)');
            if (!dateStr) return;

            const timeStr = prompt('Heure de début (format: HH:MM)');
            if (!timeStr) return;

            const duration = prompt('Durée de la consultation (minutes)', '30');
            if (!duration) return;

            const currentUser = JSON.parse(sessionStorage.getItem('current_user'));
            const availability = {
                id: Date.now(),
                doctorName: currentUser.name,
                date: dateStr,
                time: timeStr,
                duration: parseInt(duration),
                createdAt: new Date().toISOString()
            };

            const availabilities = JSON.parse(localStorage.getItem('doctor_availabilities') || '[]');
            availabilities.push(availability);
            localStorage.setItem('doctor_availabilities', JSON.stringify(availabilities));
            alert('Disponibilité ajoutée!');
            loadSchedule();
        }

        function confirmAppointment(appointmentId) {
            const appointments = JSON.parse(localStorage.getItem('hospital_appointments') || '[]');
            const appointment = appointments.find(a => a.id === appointmentId);
            
            if (appointment) {
                appointment.confirmed = true;
                appointment.confirmedAt = new Date().toISOString();
                localStorage.setItem('hospital_appointments', JSON.stringify(appointments));
                loadSchedule();
                alert('Rendez-vous confirmé!');
            }
        }

        function cancelAppointment(appointmentId) {
            if (confirm('Êtes-vous sûr de vouloir annuler ce rendez-vous?')) {
                const appointments = JSON.parse(localStorage.getItem('hospital_appointments') || '[]');
                const filtered = appointments.filter(a => a.id !== appointmentId);
                localStorage.setItem('hospital_appointments', JSON.stringify(filtered));
                loadSchedule();
                alert('Rendez-vous annulé!');
            }
        }

        function loadMyAppointments() {
            const currentUser = JSON.parse(sessionStorage.getItem('current_user'));
            const appointments = JSON.parse(localStorage.getItem('hospital_appointments') || '[]');
            const container = document.getElementById('todayAppointments');

            const today = new Date();
            const todayStr = today.toISOString().split('T')[0];

            const myAppointments = appointments.filter(apt => {
                const aptDate = new Date(apt.date).toISOString().split('T')[0];
                return apt.doctorName === currentUser.name && aptDate === todayStr;
            });

            if (myAppointments.length === 0) {
                container.innerHTML = '<p class="text-muted">Aucun rendez-vous aujourd\'hui</p>';
                return;
            }

            let html = '<div class="list-group">';
            myAppointments.forEach(apt => {
                const time = new Date(apt.date).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                html += `<div class="list-group-item">
                    <h6>${apt.patientName}</h6>
                    <p class="mb-1"><small>⏰ ${time}</small></p>
                    <p class="mb-0"><small class="text-muted">${apt.reason}</small></p>
                </div>`;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function createPrescription() {
            alert('Créer une ordonnance');
        }

        function loadPatientAssignments() {
            const patients = JSON.parse(localStorage.getItem('hospital_patients') || '[]');
            const users = JSON.parse(localStorage.getItem('hospital_users') || '{}');
            const assignments = JSON.parse(localStorage.getItem('patient_assignments') || '{}');
            const container = document.getElementById('patient-assignments');

            if (patients.length === 0) {
                container.innerHTML = '<p class="text-muted">Aucun patient disponible</p>';
                return;
            }

            let html = '<div class="table-responsive"><table class="table table-striped table-sm">';
            html += '<thead><tr><th>Patient</th><th>Âge</th><th>Maladie</th><th>Chambre</th><th>Infirmier Assigné</th><th>Actions</th></tr></thead>';
            html += '<tbody>';

            patients.forEach(patient => {
                const assignmentKey = 'patient_' + patient.id;
                const assignment = assignments[assignmentKey] || {};
                html += `<tr>
                    <td>${patient.nom} ${patient.prenom}</td>
                    <td>${patient.age}</td>
                    <td>${patient.maladie}</td>
                    <td>${patient.chambre}</td>
                    <td>${assignment.nurse || '-'}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary" onclick="assignPatientToNurse(${patient.id}, '${patient.nom} ${patient.prenom}')">Assigner</button>
                    </td>
                </tr>`;
            });

            html += '</tbody></table></div>';
            container.innerHTML = html;
        }

        function assignPatientToNurse(patientId, patientName) {
            const users = JSON.parse(localStorage.getItem('hospital_users') || '{}');
            const nurses = Object.values(users).filter(u => u.role === 'infirmier').map(u => u.name);

            if (nurses.length === 0) {
                alert('Aucun infirmier disponible');
                return;
            }

            const nurse = prompt(`Assigner ${patientName} à un infirmier:\n${nurses.join('\n')}`);
            if (!nurse) return;

            const assignments = JSON.parse(localStorage.getItem('patient_assignments') || '{}');
            const assignmentKey = 'patient_' + patientId;
            const currentUser = JSON.parse(sessionStorage.getItem('current_user'));
            
            assignments[assignmentKey] = {
                nurse: nurse,
                doctor: currentUser.name,
                assignedAt: new Date().toISOString()
            };

            localStorage.setItem('patient_assignments', JSON.stringify(assignments));
            loadPatientAssignments();
            alert(`Patient assigné à ${nurse}!`);
        }
    </script>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
