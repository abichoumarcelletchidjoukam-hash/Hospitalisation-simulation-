<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Redirection</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
    </head>
    <body class="bg-light">
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-6 text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Chargement...</span>
                    </div>
                    <h4 class="mt-3">Redirection en cours...</h4>
                    <p class="text-muted" id="message">Veuillez patienter</p>
                </div>
            </div>
        </div>

        <script>
        window.onload = function() {
            const currentUser = sessionStorage.getItem('current_user');
            
            if (!currentUser) {
                window.location.href = 'login.html';
                return;
            }

            const user = JSON.parse(currentUser);
            
            // Rediriger selon le rôle
            const rolePages = {
                'patient': 'patient.html',
                'medecin': 'medecin.html',
                'infirmier': 'infirmier.html',
                'admin': 'admin.html'
            };

            const page = rolePages[user.role] || 'login.html';
            document.getElementById('message').textContent = `Redirection vers ${user.role}...`;
            
            setTimeout(() => {
                window.location.href = page;
            }, 500);
        };
    </script>
    </body>
</html>
