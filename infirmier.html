<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Infirmier - Système Hospitalier</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <style>
            body { background-color: #f8f9fa; }
            .navbar-custom { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
            .card-custom { border: none; border-radius: 10px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        </style>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
            <div class="container">
                <a class="navbar-brand" href="#">🩺 Espace Infirmier</a>
                <div class="navbar-nav ms-auto">
                    <span class="navbar-text me-3" id="userInfo"></span>
                    <button class="btn btn-outline-light btn-sm"
                        onclick="logout()">Déconnexion</button>
                </div>
            </div>
        </nav>

        <div class="container mt-5">
            <div class="row">
                <div class="col-md-6 mb-4">
                    <div class="card card-custom">
                        <div class="card-header bg-info text-white">
                            <h5>Patients Assignés</h5>
                        </div>
                        <div class="card-body">
                            <button class="btn btn-primary btn-sm mb-3"
                                onclick="loadAssignedPatients()">Voir mes
                                patients</button>
                            <div id="patients" class="mt-3"></div>
                        </div>
                    </div>
                </div>

                <div class="col-md-6 mb-4">
                    <div class="card card-custom">
                        <div class="card-header bg-success text-white">
                            <h5>Tâches du Jour</h5>
                        </div>
                        <div class="card-body">
                            <button class="btn btn-primary btn-sm mb-3"
                                onclick="loadDailyTasks()">Voir les
                                tâches</button>
                            <div id="tasks" class="mt-3"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-12 mb-4">
                    <div class="card card-custom">
                        <div class="card-header bg-warning text-dark">
                            <h5>Surveillance Vitales</h5>
                        </div>
                        <div class="card-body">
                            <button class="btn btn-primary btn-sm"
                                onclick="recordVitals()">Enregistrer
                                vitales</button>
                            <div id="vitals" class="mt-3"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-12 mb-4">
                    <div class="card card-custom">
                        <div class="card-header bg-danger text-white">
                            <h5>Rapport de Garde</h5>
                        </div>
                        <div class="card-body">
                            <button class="btn btn-primary btn-sm mb-3"
                                onclick="openReportModal()">Créer un
                                rapport</button>
                            <div id="reports" class="mt-3"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal pour créer un rapport -->
        <div class="modal fade" id="reportModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Créer un Rapport</h5>
                        <button type="button" class="btn-close"
                            data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label>Titre du rapport</label>
                            <input type="text" class="form-control"
                                id="reportTitle"
                                placeholder="Ex: Surveillance de nuit">
                        </div>
                        <div class="mb-3">
                            <label>Contenu du rapport</label>
                            <textarea class="form-control" id="reportContent"
                                rows="5"
                                placeholder="Détails de la garde..."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary"
                            data-bs-dismiss="modal">Annuler</button>
                        <button type="button" class="btn btn-primary"
                            onclick="saveReport()">Créer</button>
                    </div>
                </div>
            </div>
        </div>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
        window.onload = function() {
            const currentUser = sessionStorage.getItem('current_user');
            if (!currentUser) {
                window.location.href = 'login.html';
                return;
            }

            const user = JSON.parse(currentUser);
            if (user.role !== 'infirmier') {
                window.location.href = 'dashboard.html';
                return;
            }

            document.getElementById('userInfo').textContent = `${user.name} (Infirmier)`;
            loadAssignedPatients();
            loadDailyTasks();
            loadReports();
        };

        function logout() {
            sessionStorage.removeItem('current_user');
            window.location.href = 'login.html';
        }

        function loadAssignedPatients() {
            const currentUser = JSON.parse(sessionStorage.getItem('current_user'));
            const assignments = JSON.parse(localStorage.getItem('patient_assignments') || '{}');
            const patients = JSON.parse(localStorage.getItem('hospital_patients') || '[]');
            const container = document.getElementById('patients');

            // Filtrer les patients assignés à cet infirmier
            const assignedPatients = patients.filter(patient => {
                const assignmentKey = 'patient_' + patient.id;
                const assignment = assignments[assignmentKey];
                return assignment && assignment.nurse === currentUser.name;
            });

            if (assignedPatients.length === 0) {
                container.innerHTML = '<p class="text-muted">Aucun patient assigné</p>';
                return;
            }

            let html = '<div class="list-group">';
            assignedPatients.forEach(p => {
                html += `<div class="list-group-item">
                    <h6>${p.nom} ${p.prenom}</h6>
                    <p class="mb-1"><small>Âge: ${p.age} ans | Chambre: ${p.chambre}</small></p>
                    <p class="mb-0 text-danger"><small><strong>Maladie:</strong> ${p.maladie}</small></p>
                </div>`;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function loadDailyTasks() {
            const currentUser = JSON.parse(sessionStorage.getItem('current_user'));
            const tasks = JSON.parse(localStorage.getItem('hospital_tasks') || '[]');
            const container = document.getElementById('tasks');

            // Filtrer les tâches assignées à cet infirmier
            const myTasks = tasks.filter(task => 
                task.assignedTo === currentUser.name || task.assignedTo.includes(currentUser.name)
            );

            if (myTasks.length === 0) {
                container.innerHTML = '<p class="text-muted">Aucune tâche pour aujourd\'hui</p>';
                return;
            }

            let html = '<div class="list-group">';
            myTasks.forEach(task => {
                html += `<div class="list-group-item">
                    <h6>${task.title}</h6>
                    <p class="mb-1 text-muted"><small>${task.description}</small></p>
                    <p class="mb-0"><small class="text-secondary">Statut: ${task.completed ? 'Complétée' : 'En attente'}</small></p>
                </div>`;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function loadReports() {
            const reports = JSON.parse(localStorage.getItem('hospital_reports') || '[]');
            const container = document.getElementById('reports');

            if (reports.length === 0) {
                container.innerHTML = '<p class="text-muted">Aucun rapport créé</p>';
                return;
            }

            let html = '<div class="list-group">';
            reports.slice().reverse().forEach(report => {
                const date = new Date(report.date).toLocaleDateString('fr-FR');
                html += `<div class="list-group-item">
                    <h6>${report.title}</h6>
                    <p class="mb-1 text-muted"><small>${report.content}</small></p>
                    <p class="mb-0"><small class="text-secondary">Par ${report.author} - ${date}</small></p>
                </div>`;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function recordVitals() {
            alert('Enregistrement des signes vitaux');
        }

        function openReportModal() {
            document.getElementById('reportTitle').value = '';
            document.getElementById('reportContent').value = '';
            new bootstrap.Modal(document.getElementById('reportModal')).show();
        }

        function saveReport() {
            const user = JSON.parse(sessionStorage.getItem('current_user'));
            const title = document.getElementById('reportTitle').value;
            const content = document.getElementById('reportContent').value;

            if (!title || !content) {
                alert('Veuillez remplir tous les champs');
                return;
            }

            const reports = JSON.parse(localStorage.getItem('hospital_reports') || '[]');
            reports.push({
                id: Date.now(),
                title: title,
                content: content,
                author: user.name,
                date: new Date().toISOString()
            });

            localStorage.setItem('hospital_reports', JSON.stringify(reports));
            bootstrap.Modal.getInstance(document.getElementById('reportModal')).hide();
            loadReports();
            alert('Rapport créé avec succès!');
        }
    </script>
    </body>
</html>
