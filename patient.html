<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Patient - Système Hospitalier</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <style>
            body { background-color: #f8f9fa; }
            .navbar-custom { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
            .card-custom { border: none; border-radius: 10px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        </style>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
            <div class="container">
                <a class="navbar-brand" href="#">👤 Espace Patient</a>
                <div class="navbar-nav ms-auto">
                    <span class="navbar-text me-3" id="userInfo"></span>
                    <button class="btn btn-outline-light btn-sm"
                        onclick="logout()">Déconnexion</button>
                </div>
            </div>
        </nav>

        <div class="container mt-5">
            <div class="row">
                <div class="col-md-6 mb-4">
                    <div class="card card-custom">
                        <div class="card-header bg-info text-white">
                            <h5>Mes Rendez-vous</h5>
                        </div>
                        <div class="card-body">
                            <button class="btn btn-primary btn-sm mb-3"
                                onclick="loadMyAppointments()">Voir mes
                                RDV</button>
                            <button class="btn btn-success btn-sm"
                                onclick="bookAppointment()">Prendre un
                                RDV</button>
                            <div id="appointments" class="mt-3"></div>
                        </div>
                    </div>
                </div>

                <div class="col-md-6 mb-4">
                    <div class="card card-custom">
                        <div class="card-header bg-success text-white">
                            <h5>Mon Dossier Médical</h5>
                        </div>
                        <div class="card-body">
                            <p><strong>ID Patient:</strong> <span
                                    id="patientId">-</span></p>
                            <p><strong>Nom:</strong> <span
                                    id="patientName">-</span></p>
                            <p><strong>Email:</strong> <span
                                    id="patientEmail">-</span></p>
                            <button class="btn btn-primary btn-sm"
                                onclick="viewMedicalHistory()">Voir mon
                                historique</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-12 mb-4">
                    <div class="card card-custom">
                        <div class="card-header bg-warning text-dark">
                            <h5>Ordonnances</h5>
                        </div>
                        <div class="card-body">
                            <div id="prescriptions"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
        window.onload = function() {
            const currentUser = sessionStorage.getItem('current_user');
            if (!currentUser) {
                window.location.href = 'login.html';
                return;
            }

            const user = JSON.parse(currentUser);
            if (user.role !== 'patient') {
                window.location.href = 'dashboard.html';
                return;
            }

            document.getElementById('userInfo').textContent = `${user.name} (Patient)`;
            document.getElementById('patientName').textContent = user.name;
            document.getElementById('patientEmail').textContent = user.username;
            document.getElementById('patientId').textContent = Math.random().toString(36).substr(2, 9).toUpperCase();
        };

        function logout() {
            sessionStorage.removeItem('current_user');
            window.location.href = 'login.html';
        }

        function loadMyAppointments() {
            const currentUser = JSON.parse(sessionStorage.getItem('current_user'));
            const appointments = JSON.parse(localStorage.getItem('hospital_appointments') || '[]');
            const container = document.getElementById('appointments');

            const myAppointments = appointments.filter(apt => apt.patientName === currentUser.name);

            if (myAppointments.length === 0) {
                container.innerHTML = '<p class="text-muted">Aucun rendez-vous programmé</p>';
                return;
            }

            let html = '<div class="list-group">';
            myAppointments.forEach(apt => {
                const date = new Date(apt.date).toLocaleDateString('fr-FR');
                const time = new Date(apt.date).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                html += `<div class="list-group-item">
                    <h6>Dr. ${apt.doctorName}</h6>
                    <p class="mb-1"><small>📅 ${date} à ${time}</small></p>
                    <p class="mb-0"><small class="badge ${apt.confirmed ? 'bg-success' : 'bg-warning'}">${apt.confirmed ? 'Confirmé' : 'En attente'}</small></p>
                </div>`;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function bookAppointment() {
            const users = JSON.parse(localStorage.getItem('hospital_users') || '{}');
            const doctors = Object.values(users).filter(u => u.role === 'medecin');

            if (doctors.length === 0) {
                alert('Aucun médecin disponible');
                return;
            }

            const doctorNames = doctors.map(d => d.name).join('\n');
            const selectedDoctor = prompt(`Sélectionner un médecin:\n${doctorNames}`);
            if (!selectedDoctor) return;

            const dateStr = prompt('Date du rendez-vous (format: JJ/MM/YYYY)');
            if (!dateStr) return;

            const timeStr = prompt('Heure du rendez-vous (format: HH:MM)');
            if (!timeStr) return;

            const reason = prompt('Motif de la consultation');
            if (!reason) return;

            const currentUser = JSON.parse(sessionStorage.getItem('current_user'));
            const appointment = {
                id: Date.now(),
                patientName: currentUser.name,
                patientEmail: currentUser.username,
                doctorName: selectedDoctor,
                date: new Date(`${dateStr.split('/').reverse().join('-')}T${timeStr}`).toISOString(),
                reason: reason,
                confirmed: false,
                createdAt: new Date().toISOString()
            };

            const appointments = JSON.parse(localStorage.getItem('hospital_appointments') || '[]');
            appointments.push(appointment);
            localStorage.setItem('hospital_appointments', JSON.stringify(appointments));
            loadMyAppointments();
            alert('Rendez-vous demandé! En attente de confirmation du médecin.');
        }

        function viewMedicalHistory() {
            alert('Votre dossier médical est confidentiel et accessible après authentification');
        }
    </script>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
